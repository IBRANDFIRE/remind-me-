
name: Unzip and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          mkdir -p extracted_files
          unzip -q *.zip -d extracted_files
          
          PROJECT_ROOT=$(find extracted_files -name "settings.gradle.kts" -o -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          
          if [ -n "$PROJECT_ROOT" ]; then
            echo "Found project root at: $PROJECT_ROOT"
            shopt -s dotglob
            cp -r "$PROJECT_ROOT"/* .
            shopt -u dotglob
            echo "Project files successfully moved to workspace root."
          else
            echo "Error: Could not locate build configuration files in zip."
            exit 1
          fi

      - name: Debug Workspace Files
        run: |
          echo "Listing root directory contents:"
          ls -la
          echo "Listing gradle directory contents:"
          ls -la gradle/ || echo "gradle directory missing!"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Create Dummy Configuration Files
        run: |
          touch .env.example
          touch .env

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Missing Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Gradle Permissions
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MedicineAlarm-APK
          path: '**/app/build/outputs/apk/debug/*.apk'


