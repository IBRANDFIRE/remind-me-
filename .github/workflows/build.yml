name: Unzip and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          unzip -q *.zip -d extracted_files
          PROJECT_DIR=$(find extracted_files -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            cp -r "$PROJECT_DIR"/* .
            cp -r "$PROJECT_DIR"/.[^.]* . 2>/dev/null || true
            echo "Successfully extracted and moved project files to root."
          else
            echo "Error: gradlew not found inside the ZIP file."
            exit 1
          fi

      - name: Create Dummy Configuration Files
        run: |
          touch .env.example
          touch .env

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Missing Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Gradle Permissions
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MedicineAlarm-APK
          path: '**/app/build/outputs/apk/debug/*.apk'



