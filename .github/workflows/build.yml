
name: Professional Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Choose build variant'
        required: true
        default: 'assembleDebug'
        type: choice
        options:
          - assembleDebug
          - assembleRelease

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Inspect Zip Contents (Debugging)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "--- ZIP CONTENTS ---"
            unzip -l *.zip
          else
            echo "No zip file found."
          fi

      - name: Extract and Locate Project Root
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            mkdir -p project_files
            unzip -q *.zip -d project_files
            
            # Find the directory containing settings.gradle or build.gradle
            PROJECT_DIR=$(find project_files -name "settings.gradle" -o -name "build.gradle" -exec dirname {} \; | head -n 1)
            
            if [ -n "$PROJECT_DIR" ]; then
              echo "Found project root at: $PROJECT_DIR"
              cp -r "$PROJECT_DIR"/* .
              cp -r "$PROJECT_DIR"/.[^.]* . 2>/dev/null || true
            else
              echo "Error: Could not locate Android project files (settings.gradle/build.gradle) in the zip."
              exit 1
            fi
            rm -rf project_files
          else
            echo "No root ZIP file detected, proceeding with standard repository structure."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache & Wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build APK (Debug or Release)
        run: |
          VARIANT="${{ github.event.inputs.build_variant || 'assembleDebug' }}"
          echo "Building variant: $VARIANT"
          ./gradlew "$VARIANT" --no-daemon

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remind me
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/release/*.apk
          retention-days: 14
